tream Telemetry",tagKicker:"Distributed Systems & Observability",category:"distributed",year:"2026",summary:"High-throughput distributed stream monitoring engine ingesting 1.8M metric events/sec with sub-10ms query execution across 64 edge nodes.",fullDescription:"Nexus was architected to replace brittle legacy APM instrumentation with an in-memory sliding-window time series aggregator. Built with a Go/Rust data plane and a reactive web UI utilizing virtualized canvas timeline rendering.",image:l5,impactMetric:"1.8M events/sec \xB7 8.4ms avg latency \xB7 99.99% uptime",techStack:["Go","Rust","Apache Kafka","TimescaleDB","React 19","Tailwind CSS","WebSockets"],liveDemoUrl:"https://example.com/nexus-demo",githubUrl:"https://github.com/alexdavidrbariua/nexus-telemetry",featured:!0,architectureHighlights:["Dual-tier ring buffer memory architecture preventing GC pauses under high ingestion volume.","Binary Protobuf protocol over WebSocket streaming live node topologies at 60 FPS.","Distributed consensus coordinator tracking node partition health across 3 global regions."],engineeringChallenges:["Mitigated severe browser thread starvation when rendering 5,000+ streaming updates per second by moving calculation off-thread to Web Workers.","Eliminated write amplification on SSD storage pools by implementing custom LSM columnar compaction trees."]},{id:"synapse-canvas",title:"Synapse Vector Node Graphics Suite",tagKicker:"Creative Engineering & WebGL",category:"creative",year:"2025",summary:"Hardware-accelerated infinite node-graph workspace supporting infinite zoom, custom GLSL shader nodes, and real-time multi-cursor collaboration.",fullDescription:"Synapse delivers desktop-grade vector editing and node compilation directly in the browser. Powered by custom WebGL rendering primitives, spatial R-Tree viewport indexing, and CRDT-based deterministic state synchronization.",image:Hs,impactMetric:"60 FPS at 50,000 nodes \xB7 <16ms frame budget \xB7 Zero jank",techStack:["TypeSc
